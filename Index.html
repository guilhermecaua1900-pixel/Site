<!DOCTYPE html><html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robux Grátis 🎮</title>
<style>
* {
  box-sizing: border-box;
}body {
margin: 0;
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
font-family: Arial, sans-serif;
background: linear-gradient(135deg, #100c29, #32145c, #120e2b);
color: white;
padding: 20px;
}

.card {
width: 100%;
max-width: 400px;
background: #1b1835;
border: 1px solid #6946ad;
border-radius: 22px;
padding: 28px 20px;
text-align: center;
box-shadow: 0 0 35px #8b42ff33;
}

.logo {
font-size: 55px;
margin-bottom: 10px;
}

h1 {
font-size: 27px;
margin-bottom: 10px;
}

p {
color: #c6bedc;
line-height: 1.5;
}

.options {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 12px;
margin: 25px 0;
}

.option {
background: #292348;
border: 2px solid #51417e;
border-radius: 14px;
color: white;
padding: 20px 10px;
font-size: 19px;
font-weight: bold;
cursor: pointer;
}

.option.selected {
border-color: #b77aff;
background: #55338c;
}

button, .link {
font-size: 16px;
font-weight: bold;
}

.primary {
width: 100%;
padding: 16px;
border: none;
border-radius: 12px;
color: white;
background: linear-gradient(90deg, #773bdf, #bd4bff);
cursor: pointer;
text-decoration: none;
display: block;
}

.primary:disabled {
opacity: .4;
cursor: not-allowed;
}

.secondary {
margin-top: 12px;
background: #37304e;
}

.hidden {
display: none;
}

.amount {
font-size: 35px;
color: #c69aff;
font-weight: bold;
margin: 20px 0;
}

.note {
font-size: 12px;
color: #aaa0c8;
margin-top: 18px;
}
</style>

</head>
<body><div class="card">  <section id="inicio">
    <div class="logo">💎</div>
    <h1>Quer ganhar Robux?</h1>
    <p>Escolha a quantidade desejada!</p><div class="options">
  <button class="option" onclick="selecionar(100,this)">💎 100</button>
  <button class="option" onclick="selecionar(400,this)">💎 400</button>
  <button class="option" onclick="selecionar(800,this)">💎 800</button>
  <button class="option" onclick="selecionar(1700,this)">💎 1.700</button>
</div>

<button class="primary" id="continuar"
  onclick="irParaResgate()" disabled>
  Continuar
</button>

  </section>  <section id="resgate" class="hidden">
    <div class="logo">🎁</div>
    <h1>Quase lá!</h1>
    <p>Quantidade selecionada:</p>
    <div class="amount" id="quantidade">400 Robux</div>
    <p>Para continuar, confira o convite abaixo.</p><a class="primary"
  href="https://www.tiktok.com/d/4/ZS9DygRNuBUrp-tdyJO/"
  target="_blank" rel="noopener noreferrer">
  Continuar
</a>

<p class="note">
  O link é um convite do TikTok Lite.
  Ele não fornece nem resgata Robux.
</p>

<button class="primary secondary"
  onclick="voltar()">
  Voltar
</button>

  </section></div><script>
let quantidadeSelecionada = null;

function selecionar(valor, botao) {
  quantidadeSelecionada = valor;

  document.querySelectorAll(".option").forEach(op => {
    op.classList.remove("selected");
  });

  botao.classList.add("selected");
  document.getElementById("continuar").disabled = false;
}

function irParaResgate() {
  if (!quantidadeSelecionada) return;

  document.getElementById("quantidade").textContent =
    quantidadeSelecionada.toLocaleString("pt-BR") + " Robux";

  document.getElementById("inicio").classList.add("hidden");
  document.getElementById("resgate").classList.remove("hidden");
}

function voltar() {
  document.getElementById("resgate").classList.add("hidden");
  document.getElementById("inicio").classList.remove("hidden");
}
</script></body>
      </html>
